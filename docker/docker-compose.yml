name: shortlinks-prod
services:
    app:
        mem_limit: 600m
        image: shortlinks:latest-production
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: production
        container_name: shortlinks_app
        restart: unless-stopped
        environment:
            - APP_ENV=production
        volumes:
            - ../.env:/var/www/html/.env
            - app_public:/var/www/html/public
            - ../storage:/var/www/html/storage
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            init_public:
                condition: service_completed_successfully
        healthcheck:
            test: >-
                php -r '$$socket = @fsockopen("127.0.0.1", 9000);
                exit($$socket === false ? 1 : 0);'
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 60s
        networks:
            - shortlinks_network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    init_public:
        image: shortlinks:latest-production
        container_name: shortlinks_init
        entrypoint: [ "sh", "-c" ]
        command:
            - |
                echo '[init] Refreshing public volume...' &&
                find /tmp/public -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + &&
                cp -r /var/www/html/public/. /tmp/public/ &&
                echo '[init] Setting permissions...' &&
                chown -R 33:33 /tmp/public &&
                find /tmp/public -type d -exec chmod 755 {} \; &&
                find /tmp/public -type f -exec chmod 644 {} \; &&
                echo '[init] Public directory copied successfully'
        volumes:
            - app_public:/tmp/public
        networks:
            - shortlinks_network

    nginx:
        mem_limit: 128m
        image: nginx:1.28-alpine
        container_name: shortlinks_nginx
        restart: unless-stopped
        environment:
            NGINX_LISTEN: "${PROD_NGINX_PORT:?Set PROD_NGINX_PORT in .env} ssl"
            NGINX_SSL_CERTIFICATE: "ssl_certificate /etc/nginx/ssl/fullchain.pem;"
            NGINX_SSL_CERTIFICATE_KEY: "ssl_certificate_key /etc/nginx/ssl/privkey.pem;"
        ports:
            - "${PROD_HTTPS_PORT}:${PROD_NGINX_PORT}"
        volumes:
            - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
            - app_public:/var/www/html/public:ro
            - ../storage:/var/www/html/storage:ro
            - type: bind
              source: "${PROD_SSL_CERTIFICATE:?Set PROD_SSL_CERTIFICATE in .env}"
              target: /etc/nginx/ssl/fullchain.pem
              read_only: true
            - type: bind
              source: "${PROD_SSL_CERTIFICATE_KEY:?Set PROD_SSL_CERTIFICATE_KEY in .env}"
              target: /etc/nginx/ssl/privkey.pem
              read_only: true
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: >-
                wget -q --no-check-certificate --spider
                https://127.0.0.1:${PROD_NGINX_PORT:?Set PROD_NGINX_PORT in .env}/healthz
                || exit 1
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - shortlinks_network
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    app_public:
        name: shortlinks_prod_public
        driver: local

networks:
    shortlinks_network:
        driver: bridge
