name: shortlinks-dev
services:
    app:
        image: shortlinks:dev
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: development
        container_name: shortlinks_app_dev
        entrypoint:
            - /bin/sh
            - /var/www/html/docker/entrypoint.sh
        restart: unless-stopped
        environment:
            APP_ENV: local
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/storage/database.sqlite
            SESSION_DRIVER: database
            SESSION_COOKIE: shortlinks_dev_session
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        volumes:
          - ..:/var/www/html
          - /var/www/html/vendor
          - app_public:/var/www/html/public
          - ../storage-dev:/var/www/html/storage
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: >-
                php -r '$$socket = @fsockopen("127.0.0.1", 9000);
                exit($$socket === false ? 1 : 0);'
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 60s
        mem_limit: 600m
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - shortlinks_network_dev

    assets:
        image: node:20-alpine
        container_name: shortlinks_assets_dev
        restart: unless-stopped
        working_dir: /var/www/html
        entrypoint:
            - /bin/sh
            - /var/www/html/docker/frontend-entrypoint.sh
        volumes:
            - ..:/var/www/html
            - app_public:/var/www/html/public
            - node_modules:/var/www/html/node_modules
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: >-
                test -f /tmp/frontend-ready
                && test -f public/build/manifest.json
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 60s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - shortlinks_network_dev

    nginx:
        image: nginx:1.28-alpine
        container_name: shortlinks_nginx_dev
        restart: unless-stopped
        environment:
            NGINX_LISTEN: "${DEV_NGINX_PORT:?Set DEV_NGINX_PORT in .env} ssl"
            NGINX_SSL_CERTIFICATE: "ssl_certificate /etc/nginx/ssl/fullchain.pem;"
            NGINX_SSL_CERTIFICATE_KEY: "ssl_certificate_key /etc/nginx/ssl/privkey.pem;"
        ports:
            - "${DEV_HTTPS_PORT}:${DEV_NGINX_PORT}"
        volumes:
            - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
            - app_public:/var/www/html/public:ro
            - ../storage-dev:/var/www/html/storage:ro
            - type: bind
              source: "${DEV_SSL_CERTIFICATE:?Set DEV_SSL_CERTIFICATE in .env}"
              target: /etc/nginx/ssl/fullchain.pem
              read_only: true
            - type: bind
              source: "${DEV_SSL_CERTIFICATE_KEY:?Set DEV_SSL_CERTIFICATE_KEY in .env}"
              target: /etc/nginx/ssl/privkey.pem
              read_only: true
        depends_on:
            assets:
                condition: service_healthy
        mem_limit: 128m
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - shortlinks_network_dev

volumes:
    app_public:
        name: shortlinks_dev_public
        driver: local
    node_modules:
        name: shortlinks_dev_modules
        driver: local
networks:
    shortlinks_network_dev:
        driver: bridge
